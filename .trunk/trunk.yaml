      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - sourcery@1.35.0
    - bandit@1.8.3
    - checkov@3.2.411
    - trivy@0.61.1
    - trufflehog@3.88.25
    - taplo@0.9.3
